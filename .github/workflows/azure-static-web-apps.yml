name: Deploy WEB to Azure Static Web Apps

# Consumes the `web-build` artifact produced by build-web.yml and uploads it
# to Azure Static Web Apps. The artifact is the truth — this job does NOT
# read the working tree's WEB/ folder, so a stale committed copy can never
# accidentally ship to production.
#
# Trigger:
#   - completed: build-web.yml (on push to main)
#   - workflow_dispatch for manual deploys of an existing build (rarely
#     useful; prefer rerunning the build job).
#
# Required secrets:
#   - AZURE_STATIC_WEB_APPS_API_TOKEN — provisioning the Static Web App
#     through the Azure Portal with GitHub as the source sets this up.

on:
  workflow_run:
    workflows: ["Build WebGL"]
    types: [completed]
  workflow_dispatch:

# workflow_run can't filter on branch or path directly; gate inside the job.
jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    name: Upload WEB/ to Azure
    permissions:
      contents: read
      actions: read  # required to download artifacts from the build run
    steps:
      - name: Download web-build artifact
        uses: actions/download-artifact@v4
        with:
          # workflow_run events expose the upstream run via github.event.
          # Run ID + artifact name uniquely identifies the artifact.
          name: web-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: WEB

      - name: Verify downloaded artifact
        working-directory: WEB
        run: |
          set -e
          for f in index.html staticwebapp.config.json Build/WEB.loader.js; do
            if [ ! -f "$f" ]; then
              echo "::error::Downloaded artifact is missing $f — refusing to deploy."
              exit 1
            fi
          done
          echo "Deploying WEB/ to Azure Static Web Apps."

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: 'WEB'
          output_location: ''
          skip_app_build: true
          skip_api_build: true
