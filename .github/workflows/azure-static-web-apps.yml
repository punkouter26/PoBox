name: Deploy WEB to Azure Static Web Apps

# The Unity WebGL output in WEB/ is committed, so this workflow only uploads —
# it does not run Unity. Rebuild locally (Unity: switch to WebGL, build to
# WEB/) and commit the result, then push.
on:
  push:
    branches: [main]
    paths:
      - 'WEB/**'
      - '.github/workflows/azure-static-web-apps.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Upload WEB/ to Azure
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          # Already-built static output: no build step, no API.
          app_location: 'WEB'
          output_location: ''
          skip_app_build: true
          skip_api_build: true
