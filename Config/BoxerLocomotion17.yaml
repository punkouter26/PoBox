# Locomotion gen 17 (2026-08-22). GEN 16 RERUN WITH THE BUG FIXED. Identical
# config to gen 16 -- gen 15's recipe, three bodies, nothing retuned. The only
# thing that changed is that the reward function no longer throws.
#
# WHAT GEN 16 ACTUALLY MEASURED. It looked like "gen 15's recipe cannot handle
# three bodies": reward plateaued at ~0.18 against a 0.55 gate and sat there for
# 5M steps. Stopping it at its decision point and reading the per-body split --
# which the trainer's 16-agent average hides completely -- gave this:
#
#   body      n   reward     1st fall
#   Capsule   6   0.219      128 steps
#   Grandma   5   0.000000    68 steps
#   Grandpa   5   0.000000    77 steps
#
# EXACTLY zero, not merely low, while those same agents were upright at 85-94%
# of standing head height and accumulating normal-looking speed-match stats.
#
# THE CAUSE. Reward_Locomotion resolved the foot collider with
# FootLeftSensor.GetComponent<Collider>(). The capsule carries its collider on
# the same object as the sensor ("FootL"); Grandma and Grandpa put the sensor on
# the skeleton's foot bone ("LeftFoot") and the collider on a child of it
# ("LeftFoot_Sole"). So the field was null for ten of sixteen agents, and the
# clearance term dereferenced it every FixedUpdate --
# MissingComponentException, thrown AFTER the speed-match stats were recorded
# and BEFORE AddReward was reached. Plausible statistics, zero reward, forever.
# Over a thousand exceptions in the Editor console, none of which appear in the
# trainer's stdout, which is the only place a headless run is usually watched.
#
# So gen 16 was not a result about three bodies. It was six capsules training
# normally while ten agents fed pure noise into the batch. Fixed in
# Reward_Locomotion.ResolveFootCollider, which searches children and now fails
# LOUDLY rather than leaving a null to be discovered by noticing that a third of
# the field never learns.
#
# VERIFIED BEFORE STARTING THIS RUN, in inference on the gen 16 checkpoint:
# 16/16 foot colliders resolve, console clean, and mean reward per body is
# Capsule 0.121 / Grandma 0.024 / Grandpa 0.040. Grandma and Grandpa still trail
# badly -- of course they do, the brain being run was fitted while they
# contributed nothing -- but they EARN, so there is a gradient for them now.
#
# WHAT THIS RUN ACTUALLY TESTS, for the first time: whether gen 15's recipe
# generalises across three bodies. Gen 16 never tested it.
#
#   Working:     reward climbs past gen 16's ~0.18 ceiling and keeps going. The
#                honest comparison for lesson pace is gen 15, which sat on
#                StandStill until 5.7M steps and cleared it at 0.578 -- a long
#                StandStill is NORMAL here and is not a warning sign.
#   Real conflict: if THIS plateaus well short of 0.55 with all three bodies
#                earning comparably, then the partial-observability argument is
#                finally the live hypothesis and Config/BoxerLocomotion18.yaml
#                (recurrent policy) is next -- backed by a run that measured it.
#   Still broken: any body sitting at reward ~0 means another rig difference is
#                being dereferenced somewhere. CHECK THE EDITOR CONSOLE, not
#                just the trainer log. That is the lesson of gen 16.
#
# NOTED AT 1M STEPS OF THIS RUN, AND IT MAY DECIDE HOW TO READ THE ENDING. The
# fix worked -- reward reached 0.285 by 1M against gen 16's 0.170 and its 0.18
# ceiling, and throughput rose from 1,210 to 1,431 steps/s now that ten agents
# are not throwing an exception every physics step. But the per-body split is
# wide:
#
#   Capsule 0.251   Grandpa 0.139   Grandma 0.057
#
# All non-zero, which is the point. The structural problem is that THE
# CURRICULUM GATES ON THE MEAN. Every threshold in this file was calibrated on
# single-body runs where the mean and the per-agent value were the same number.
# In a mixed scene they are not. If the capsule reaches 0.55 while Grandma sits
# at 0.06, the sixteen-agent mean lands near 0.32 and StandStill NEVER OPENS --
# not because nothing learned, but because a gate written for one body is being
# applied to a population.
#
# So if this run plateaus in the 0.30-0.40 band with the capsule clearly
# competent and Grandma trailing, THAT IS NOT THE SAME FAILURE AS GEN 16 and it
# is not evidence for the recurrent policy either. The fix would be to
# recalibrate the gates for a mixed population -- or better, to gate on the
# WORST body rather than the mean, so the curriculum advances only when every
# fighter can do the lesson, which is what the game actually needs.
#
# Do not change the gates mid-run; it would confound the one variable this run
# exists to test. Read the per-body split at the end and decide then.
#
# WATCH THE PER-BODY SPLIT, not just the mean. The whole of gen 16 was lost to
# an average that looked merely disappointing while hiding a hard zero.
#
# Observation count still 127. Not resumable from gen 16 -- that policy was
# fitted against a broken environment.

behaviors:
  Boxer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 18000000
    time_horizon: 256
    summary_freq: 50000
    keep_checkpoints: 25
    # Raised from 200000 now the run is headless: the trainer no longer has to
    # be stopped for in-scene tests, so checkpoints exist for rollback rather
    # than to cap the cost of an interruption.
    checkpoint_interval: 500000

environment_parameters:
  # Upper end of the commanded speed. Reward_Locomotion draws each episode's
  # command from [0, speed_command_max] while the cap is low, and holds the
  # floor at 60% of the cap once the cap clears 0.3 m/s, so late lessons
  # cannot be farmed by banking easy near-zero commands.
  speed_command_max:
    curriculum:
      - name: StandStill
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.55
          require_reset: true
        value: 0.0
      - name: Sway
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.60
          require_reset: true
        value: 0.2
      - name: Shuffle
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.45
          require_reset: true
        value: 0.4
      - name: Step
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.40
          require_reset: true
        value: 0.6
      - name: Stride
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.38
          require_reset: true
        value: 0.8
      - name: Walk
        value: 1.0
