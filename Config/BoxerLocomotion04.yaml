# Locomotion — one brain that stands AND walks, generation 4 (2026-08-19).
#
# Gens 1-3 all converged on the same non-answer: stand perfectly, never lift a
# foot. Gen 3 kept single-support at 0.005 and foot lift at ~0.1 mm even with a
# 65% reward penalty for failing both. Reweighting was not the fix, because the
# blocker was not incentive:
#
#   1. NO CLOCK. The policy is feed-forward with no memory, and walking is
#      periodic. A reactive net cannot invent a rhythm. Gen 4 adds a gait phase
#      (sin/cos of a 1.4 Hz timer) to the observations -> 127 obs, up from 125.
#      This is the change most likely to matter.
#   2. FREE EASY EPISODES. Commanded speed was drawn from [0, cap], so with cap
#      1.0 about 30% of episodes asked for <0.3 m/s, where standing still is
#      correct and scores ~1. Mean reward read 0.34 purely off those. Gen 4
#      holds the draw at >=60% of the cap once the cap exceeds 0.3 m/s.
#
# Weights are unchanged from gen 3 (clearance 0.35, single support 0.30,
# speed 0.50, head height 0) — that part was sound, it just could not act on a
# behaviour the policy had no means to produce.
#
# 127 obs makes every earlier .onnx incompatible; the gen-1 brain is shelved in
# Assets/Agents/_obsolete_125obs/. Watch Locomotion/SingleSupportMean: it is the
# raw one-foot fraction now, and anything above ~0.3 means real alternation.
#
# Gen 2 added single-support and foot-clearance terms and STILL did not walk:
# measured 0.09 mm of foot lift at 11 M steps while reward climbed to 0.42.
# The terms were right, the weights were not. Weights are EXPONENTS in the
# geometric mean, so a small weight is nearly free to ignore — at gen 2's
# numbers a fighter that stood still and ignored the speed command still
# scored 0.248, which was good enough to keep.
#
# Gen 3 reweights so walking dominates:
#   clearance      0.10 -> 0.35
#   single support 0.15 -> 0.30
#   speed match    0.40 -> 0.50
#   head height    0.15 -> 0     (the one term that paid for NOT moving)
# Scored outcome: standing 0.064, walking 0.670 — a 10x gap, vs 0.248 before.
#
# Watch Locomotion/ClearanceMean. Gen 3 logs the RAW single-support fraction
# (gen 2 logged the blended value, which could not distinguish both-feet-down
# from true alternation). Expect reward to CRASH when lesson 2 starts and the
# gait terms switch on — that drop is the point.
#
# NOTE: rewarding single support pushes toward less double-support time. If it
# converges on hopping or running rather than walking, lower _singleSupportWeight
# before touching anything else.
#
# Gen 1 solved standing and then STOPPED: measured 3 cm travelled in 19 s at
# mean reward 0.94, both feet planted the whole time, feet never lifting. With
# only upright + head-height + speed terms, standing still scored better than
# risking a step. Gen 2 adds two terms that standing cannot satisfy:
#   * single-support — pays only when exactly ONE foot is grounded
#   * foot clearance — pays the swinging foot for leaving the floor
# and tightens SPEED_KERNEL from 0.6 to 0.3 so speed error actually bites.
#
# Thresholds are LOWER than gen 1: five multiplied factors cannot all sit near
# 1, so the same behaviour scores lower in absolute terms. Watch
# Locomotion/SingleSupportMean and Locomotion/ClearanceMean in TensorBoard —
# if those stay near 0 while reward climbs, it has found a new cheat.
#
# Replaces the split balance/walk plan. Standing is the 0 m/s case of walking,
# so there is one reward and one model line. The commanded speed is BOTH a
# curriculum parameter and an observation, so the finished brain obeys whatever
# speed the game asks for at runtime: 0 for the balance contest, 1.0 for the
# walk race.
#
# Two deliberate changes from BoxerBalance04/05, both fixing measured failures:
#   1. NO terminal fall penalty. The old -1 was ~40x anything a 1.5 s episode
#      could earn; mean reward pinned at -0.98 for 1.85 M steps. Ending the
#      episode already forfeits every remaining step.
#   2. Curriculum thresholds are absolute, not relative to a -1 floor.
#
# No init_path: the command observations change the input layout, so older
# .onnx files are incompatible. This is a fresh model line by design.
#
# Behavior key MUST be "Boxer" (BehaviorParameters name).
# Run: mlagents-learn Config/BoxerLocomotion04.yaml --run-id=boxer_locomotion04
#      --env Builds/BoxerLocomotionEnv/BoxerLocomotionEnv.exe --no-graphics
#      --num-envs 4 --base-port 5050
behaviors:
  Boxer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.999
        strength: 1.0
    max_steps: 15000000
    time_horizon: 256
    summary_freq: 50000
    keep_checkpoints: 25
    checkpoint_interval: 500000

environment_parameters:
  # Upper end of the commanded speed. Reward_Locomotion draws each episode's
  # command uniformly from [0, speed_command_max], so lesson 1 is pure standing
  # and later lessons mix standing with progressively faster walking — the
  # brain never stops practising the slow end.
  speed_command_max:
    curriculum:
      - name: StandStill
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.15
        value: 0.0
      - name: Shuffle
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.18
        value: 0.3
      - name: Step
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 0.20
        value: 0.7
      - name: Walk
        value: 1.0
