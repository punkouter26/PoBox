# RENUMBERED 18 -> 19 ON 2026-08-23. Gen 18 is now the budget continuation of
# gen 17. This recurrent-policy idea remains staged and unrun; see below for why
# it was demoted from being "next".

# RENUMBERED FROM GEN 17 TO GEN 18 ON 2026-08-22, AND DEMOTED. The reasoning
# below is still sound but it answers a question that was never actually being
# asked. It was written to explain why gen 16 plateaued, and gen 16 plateaued
# because ten of its sixteen agents were throwing MissingComponentException in
# the reward function every physics step and earning literally zero -- not
# because of gradient conflict between bodies. Nothing about "the policy cannot
# tell which body it is in" had been demonstrated at all; the run had never
# tested it, because two thirds of the field was never learning anything.
#
# Gen 17 is now the corrected three-body run: gen 15's recipe, three bodies, and
# a reward function that all three can actually earn from. Only if THAT plateaus
# does the argument below become the live hypothesis, and by then it will be
# supported by a run that actually measured it.
#
# Original text follows, unchanged.
#
# Locomotion gen 17 (2026-08-22). PREPARED, NOT YET RUN -- staged while gen 16
# was still training so that if gen 16 misses its decision point no time is
# lost. Run it only if gen 16 actually fails; if gen 16 succeeds, this file is
# the next step anyway, for the reason below.
#
# THE DIAGNOSIS GEN 16 WAS MISSING. Gen 16 trains one policy across three rigs
# whose mass distributions differ by an order of magnitude (capsule torso
# segment 1.1 kg, Grandpa's 24.3 kg). It began drifting DOWNWARD in reward at
# around 500k steps, which is not what "harder domain" looks like -- harder
# looks like slower, not worse.
#
# Reading Agent_FighterBoxing.CollectObservations explains it. The vector is
# pelvis height, velocities and orientation; per-joint local rotation and
# angular velocity; foot contacts and heights; the locomotion command; the gait
# phase. There is NOTHING IN IT THAT DESCRIBES THE BODY. No masses, no segment
# lengths, no identifier. So the policy cannot know which of the three rigs it
# is currently driving, and it is being asked to produce one torque mapping that
# is simultaneously correct for all three.
#
# That is not merely a harder problem, it is a PARTIALLY OBSERVABLE one, and no
# feed-forward policy can solve it. The best such a network can do is the
# average of three incompatible answers, which is what a reward curve that
# climbs and then sags looks like from the outside. Dropping to two bodies --
# which is what the previous version of this plan proposed -- would have made
# the symptom smaller without touching the cause, and would have left the third
# fighter exactly where it started.
#
# THE FIX: give the policy a memory, so it can identify the body it is in from a
# short history of how that body answered its own torques. This is the standard
# answer to domain randomisation over unobservable dynamics, and here it costs
# ONE CONFIG BLOCK: no code change, no new observations, and -- the reason that
# matters in this project specifically -- no change to the observation count, so
# the 127-wide contract that has broken this repo repeatedly stays exactly where
# it is.
#
# THE ALTERNATIVE, deliberately not taken first: add morphology observations
# (per-limb mass ratios, segment lengths) so the body is directly visible. It
# would probably also work and would train faster than an LSTM. It is second
# because it widens the observation vector, which invalidates every .onnx in
# Assets/Agents and needs an edit to ComputeObservationCount plus every tool
# that sizes a sensor. Try the free fix before the expensive one.
#
# COSTS, so they are not a surprise: a recurrent policy trains slower per step
# than a feed-forward one, and gen 16's ~1,200 steps/s should be expected to
# drop. This is NOT resumable from gen 16 -- the network has a different shape.
#
# WATCH: the same stats, with one specific question. If memory is the answer,
# Locomotion/Alternation and SingleSupportMean should climb TOGETHER and keep
# climbing past the 500k mark where gen 16 turned over. If this run also sags,
# memory was not the missing piece and the morphology observations above are
# next -- not more steps.
#
# EVERYTHING ELSE IS GEN 15's RECIPE, UNCHANGED, for the fourth generation
# running. Same reward terms, same gates, same three-body scene as gen 16.

behaviors:
  Boxer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      # The whole of gen 17, in four lines.
      #
      # sequence_length 64 is 1.28 s at 50 Hz -- comfortably long enough to feel
      # how a body answers its own torques, which is the inference being asked
      # for. time_horizon (256) must be at least this, and batch_size (2048) is
      # a multiple of it; both already hold, so nothing else moves.
      memory:
        sequence_length: 64
        memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 18000000
    time_horizon: 256
    summary_freq: 50000
    keep_checkpoints: 25
    # Raised from 200000 now the run is headless: the trainer no longer has to
    # be stopped for in-scene tests, so checkpoints exist for rollback rather
    # than to cap the cost of an interruption.
    checkpoint_interval: 500000

environment_parameters:
  # Upper end of the commanded speed. Reward_Locomotion draws each episode's
  # command from [0, speed_command_max] while the cap is low, and holds the
  # floor at 60% of the cap once the cap clears 0.3 m/s, so late lessons
  # cannot be farmed by banking easy near-zero commands.
  speed_command_max:
    curriculum:
      - name: StandStill
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.55
          require_reset: true
        value: 0.0
      - name: Sway
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.60
          require_reset: true
        value: 0.2
      - name: Shuffle
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.45
          require_reset: true
        value: 0.4
      - name: Step
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.40
          require_reset: true
        value: 0.6
      - name: Stride
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.38
          require_reset: true
        value: 0.8
      - name: Walk
        value: 1.0
