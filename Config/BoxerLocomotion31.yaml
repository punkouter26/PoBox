# Locomotion gen 31 (2026-09-07). The walk ladder gated on PROGRESS instead of
# reward, and sized to a budget it can actually finish.
#
# WHY. Gen 30 stalled on rung three. Its mean reward sat at 0.337 against the
# Shuffle gate's 0.45 and crept, so it would never have reached the commanded
# speeds where sliding stops being possible -- and sliding is exactly what all
# four walk runs this session did.
#
# THE GATES ARE GEN 18'S AND THEY NO LONGER MEAN WHAT THEY MEANT. 0.55 / 0.60 /
# 0.45 / 0.40 / 0.38 were calibrated against gen 18's reward function. This
# session changed three terms in it -- off-axis error entered the speed term,
# the support term learned to tell a stance from a flamingo, and the ground
# sensor started reporting contact correctly -- so the same NUMBER now
# corresponds to a different level of competence. Carrying the old thresholds
# across a reward change silently re-tunes the curriculum, and here it stopped
# it dead.
#
# This is the second time today the same mistake showed up: gen 27's shove
# ladder was gated on a reward the shoving itself depressed. Progress gates are
# immune to both.
#
#   rung        progress   step (of 25M)   commanded speed
#   StandStill    ---            0            0.0   inherited, already solved
#   Sway          0.08         2.0M           0.2
#   Shuffle       0.20         5.0M           0.4
#   Step          0.32         8.0M           0.6
#   Stride        0.44        11.0M           0.8
#   Walk          0.56        14.0M           1.0
#
# max_steps drops 50M -> 25M so the ladder maps onto a budget this run can
# finish and the learning rate anneals over the run that actually happens
# instead of half of one. Eleven million steps are left at full walking pace.
#
# Everything else is gen 30: started from boxer_locomotion25, beta 0.02, the
# off-axis penalty faded by commanded speed.
#
# SUCCESS: Alternation off the floor and climbing at the Step rung and beyond,
# where standing still cannot satisfy the speed term. gen 18 reached 0.766.
#
# Run: mlagents-learn Config/BoxerLocomotion31.yaml --run-id=boxer_locomotion31
#      --initialize-from=boxer_locomotion25 --env EnvBuild6/PoBoxTrain.exe
#      --no-graphics --num-envs 8 --base-port 6000

behaviors:
  Boxer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.02
      epsilon: 0.2
      lambd: 0.97
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 25000000
    time_horizon: 1000
    summary_freq: 50000
    keep_checkpoints: 40
    checkpoint_interval: 1000000

environment_parameters:
  speed_command_max:
    curriculum:
      - name: StandStill
        completion_criteria:
          measure: progress
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.08
          require_reset: true
        value: 0.0
      - name: Sway
        completion_criteria:
          measure: progress
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.2
          require_reset: true
        value: 0.2
      - name: Shuffle
        completion_criteria:
          measure: progress
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.32
          require_reset: true
        value: 0.4
      - name: Step
        completion_criteria:
          measure: progress
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.44
          require_reset: true
        value: 0.6
      - name: Stride
        completion_criteria:
          measure: progress
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.56
          require_reset: true
        value: 0.8
      - name: Walk
        value: 1.0
