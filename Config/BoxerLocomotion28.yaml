# Locomotion gen 28 (2026-09-07). The walk curriculum, STARTED FROM A BRAIN THAT
# ALREADY STANDS.
#
# Launched with --initialize-from=boxer_locomotion25, which at the time had
# solved standing outright: reward 0.913, single support 0.000 on every body,
# and steps-between-falls saturating the 3000-step episode on the capsule (2889)
# and Grandpa (2754). Gen 20, the brain that ships, manages 80 on the capsule.
#
# WHY. Gen 26 is the same ladder from scratch and spent its first ten million
# steps doing nothing but learning to stand -- StandStill is rung one, and gen 17
# recorded the same nine-million-step toll before it. That work is now done and
# banked, so a run that inherits it can spend its whole budget on the rungs that
# actually involve walking. This is the Stage 1 -> Stage 2 hand-off
# BoxerWalk01.yaml used with init_path, applied to the locomotion line.
#
# LEGAL BECAUSE THE CONTRACT IS IDENTICAL. Same scene, same 127-observation
# layout, same 30 continuous actions, same reward code. Only the curriculum
# differs, and a curriculum is an environment parameter rather than part of the
# model. Adding any observation would break this and need a fresh model line.
#
# WHAT THIS RUN IS FOR. The walk race, and one number: Systems_WalkContest
# requires MIN_WIN_DISTANCE = 0.75 m, and Locomotion_gen18_34M -- the brain that
# ships -- averages 0.767 m before falling. The field sits exactly on the pass
# mark, which is why 11 of 13 rounds played on 2026-08-23 were no contest. Any
# real margin above 0.75 m turns those rounds back into races.
#
# SUCCESS: BestRunDistance at commanded speed 1 clearly above 0.75 m, with
# Alternation at or above gen 18's 0.766. Distance bought by standing still is
# not walking, and gens 13 and 14 each bought a headline number that way.
#
# RISK, STATED UP FRONT: inheriting a policy that has learned to stand VERY still
# may make it harder to persuade to move -- the same catastrophic-forgetting
# trade gen 20 accepted in the other direction. Gen 26 continues from scratch as
# the control, so the pair says whether the head start helped or hindered.
#
# Run: mlagents-learn Config/BoxerLocomotion28.yaml --run-id=boxer_locomotion28
#      --initialize-from=boxer_locomotion25 --env EnvBuild4/PoBoxTrain.exe
#      --no-graphics --num-envs 5 --base-port 5700

behaviors:
  Boxer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.97
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 50000000
    time_horizon: 1000
    summary_freq: 50000
    keep_checkpoints: 40
    checkpoint_interval: 1000000

environment_parameters:
  # The six-rung ladder is gen 18's, value for value and threshold for
  # threshold. Changing the curriculum in the same generation as the estimator
  # would make the comparison against gen 18 unreadable.
  speed_command_max:
    curriculum:
      - name: StandStill
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.55
          require_reset: true
        value: 0.0
      - name: Sway
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.60
          require_reset: true
        value: 0.2
      - name: Shuffle
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.45
          require_reset: true
        value: 0.4
      - name: Step
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.40
          require_reset: true
        value: 0.6
      - name: Stride
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.38
          require_reset: true
        value: 0.8
      - name: Walk
        value: 1.0
