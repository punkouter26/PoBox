# Locomotion gen 25 (2026-09-07). Balance run. Gen 24's reward -- horizon fix,
# stance-not-flamingo, off-axis drift -- on top of a ground sensor that finally
# reports contact correctly on all three rigs.
#
# THE SENSOR FIX IS THE POINT OF THIS RUN, and it is a code change rather than
# anything in this file. See Sensor_GroundContact.
#
# Ground contact was a running total of OnCollisionEnter minus OnCollisionExit.
# On the imported character rigs that total desynchronises and never recovers,
# because ResetContacts() zeroes it while the foot is still resting on the floor
# and no new Enter is ever generated for a pair that never separated. Measured
# with -evalDiagnoseFeet on a fighter standing still:
#
#   Capsule/Fighter_00  L[on 'FootL',     grounded=True,  minY=-0.0024]
#   Grandma/Fighter_13  L[on 'LeftFoot',  grounded=False, minY=-0.0043]
#                       R[on 'RightFoot', grounded=False, minY=-0.0083]
#
# Grandma's soles are millimetres BELOW the floor plane -- interpenetrating it --
# while both sensors report airborne.
#
# Everything downstream is computed from those flags: singleSupport, the
# clearance gate, the whole support term, and fall detection itself. So TEN OF
# SIXTEEN FIGHTERS have been training against a corrupted objective, and the
# per-body ordering twenty generations read as "the character rigs are harder"
# tracks sensor health almost exactly:
#
#     body      feet grounded (heuristic)   steps between falls (gen 21 @ 3.35M)
#     Capsule        0.97 / 0.98                      104
#     Grandpa        0.61 / 1.00                       66
#     Grandma        0.41 / 0.41                       38
#
# Contact is now re-affirmed from OnCollisionStay every physics step instead of
# tallied, so no reset and no missing Exit can desynchronise it.
#
# WHY GENS 21-24 ARE NOT SIMPLY CONTINUED: they cannot be. Their reward signal
# was wrong for two thirds of the population, so more steps only fit them more
# closely to the wrong objective. Gen 21 is left running as the pre-fix control.
#
#
# SUCCESS: Grandma and Grandpa climbing like the capsule instead of flatlining,
# and StepsBetweenFalls past gen 20's like-for-like 98.6 (ALL) on every body.
#
# FAILURE THAT WOULD MEAN SOMETHING: the characters still flatline. With the
# sensor honest that would be the first real evidence that their rigs, and not
# the instrumentation, are the limit -- a question every previous generation
# assumed the answer to.
#
# Run: mlagents-learn Config/BoxerLocomotion25.yaml --run-id=boxer_locomotion25
#      --env EnvBuild4/PoBoxTrain.exe --no-graphics --num-envs 7 --base-port 5400

behaviors:
  Boxer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.97
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 60000000
    time_horizon: 1000
    summary_freq: 50000
    keep_checkpoints: 40
    checkpoint_interval: 1000000

environment_parameters:
  # PINNED AT ZERO, exactly as gen 20. This run must differ from gen 20 in the
  # estimator and in nothing else that the curriculum controls.
  speed_command_max: 0.0
