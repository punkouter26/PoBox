# Locomotion gen 15 (2026-08-22). Gen 14 killed the hop and killed the stepping
# with it, through a bug in my own term.
#
# WHAT GEN 14 MEASURED (results/boxer_locomotion14, full 18M steps):
#
#   step   lesson  reward  1stFall  stumbles  support  clear  symmetry
#  13.35M     3     0.450      971     12.67    0.027  0.081     0.910
#  15.30M     3     0.312       94     31.56    0.072  0.198     0.701
#  17.95M     3     0.329       92     31.56    0.087  0.251     0.720
#
#                        gen 13    gen 14
#   final lesson         Walk      Step
#   SingleSupportMean    0.951     0.087
#   reward               0.613     0.329
#
# The symmetry factor did stop gen 13's one-legged hop. It also cost 11x the
# single support and stalled at the Step gate for the last 5M steps.
#
# WHY, AND IT WAS A BUG RATHER THAN A TRADEOFF: symmetry was 1 - |stanceBias|
# over an EMA of which foot was bearing, and that average was only updated
# during SINGLE SUPPORT. A fighter standing on both feet never moved its bias
# off the zero it was initialised to, so it collected FULL symmetry credit for
# never stepping. Gen 14 removed the reward for hopping and handed out free
# credit for standing in the same edit. The policy took the free credit.
#
# THE FIX IS IN CODE: alternation is now a RATE OF STANCE CHANGES rather than a
# load balance. One term closes both doors, because both failures are the same
# failure -- nothing changes:
#
#   standing on both feet              0.000
#   gen 13 one-legged hop              0.000
#   swap every 1.4 s                   0.500
#   stride cadence, swap every 0.7 s   1.000
#
# The rig's scripted gait runs at 1.4 Hz, so a stride swaps stance about every
# 0.7 s -- one change per ~35 fixed steps at 50 Hz, which is where full credit
# sits. Smoothing is ~2 s so a single missed step does not read as a stop.
#
# Everything else is unchanged: no stumble budget, true ground clearance, gen 9
# support shape, gen 10 ramp, GAIT_FULL_SPEED 0.6, and the same gates for the
# fourth generation running.
#
# WATCH Locomotion/Alternation, a new stat replacing GaitSymmetry.
#   Working:     alternation climbs with support, both above ~0.3, while
#                SpeedMatchMean holds. That is a real gait.
#   Hopping:     support high, alternation pinned near 0. Gen 13's behaviour
#                surviving the penalty; the term needs its own exponent rather
#                than being a multiplier on support.
#   Standing:    support AND alternation both near 0 with 1stFall climbing. Back
#                to gen 14's outcome, meaning the gait credit is now too small
#                to be worth the falls, and gen 16 raises _singleSupportWeight
#                rather than touching alternation.
#
# NOT RESUMABLE from gen 14 or earlier: the support term changes shape.
# Observation count is still 127.
#
# NOTE ON RUN LENGTH: started under a 1-hour training window, which at ~1,900
# steps/s reaches roughly 6.8M of the 18M budget -- far enough to clear
# StandStill and Sway and to read Shuffle, which is where the term first bites.
# The run is worth continuing past that if alternation is moving.

behaviors:
  Boxer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 18000000
    time_horizon: 256
    summary_freq: 50000
    keep_checkpoints: 25
    # Raised from 200000 now the run is headless: the trainer no longer has to
    # be stopped for in-scene tests, so checkpoints exist for rollback rather
    # than to cap the cost of an interruption.
    checkpoint_interval: 500000

environment_parameters:
  # Upper end of the commanded speed. Reward_Locomotion draws each episode's
  # command from [0, speed_command_max] while the cap is low, and holds the
  # floor at 60% of the cap once the cap clears 0.3 m/s, so late lessons
  # cannot be farmed by banking easy near-zero commands.
  speed_command_max:
    curriculum:
      - name: StandStill
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.55
          require_reset: true
        value: 0.0
      - name: Sway
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.60
          require_reset: true
        value: 0.2
      - name: Shuffle
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.45
          require_reset: true
        value: 0.4
      - name: Step
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.40
          require_reset: true
        value: 0.6
      - name: Stride
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.38
          require_reset: true
        value: 0.8
      - name: Walk
        value: 1.0
