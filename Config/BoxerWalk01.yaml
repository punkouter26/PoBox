# Stage 2 — walking, generation 1 (2026-08-19). Four fighters line up on one
# edge of a ring-sized lane and walk straight to the far edge. Reward_Balance
# still owns uprightness and the -1 fall terminal; Reward_Walk pays for travel
# along +Z and adds a goal bonus.
#
# init_path loads a Stage-1 balance brain so the walker starts already knowing
# how to stand. The observation vector is UNCHANGED from Stage 1 (the goal is a
# fixed world direction, so no goal observation was added) — that is what makes
# init_path legal here. Adding any observation later breaks this and needs a
# fresh model line.
#
# Behavior key MUST be "Boxer" (BehaviorParameters name).
# Run: mlagents-learn Config/BoxerWalk01.yaml --run-id=boxer_walk01
#      --env Builds/BoxerWalkEnv/BoxerWalkEnv.exe --no-graphics
#      --num-envs 4 --base-port 5040
behaviors:
  Boxer:
    trainer_type: ppo
    init_path: results/boxer_balance05/Boxer
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.999
        strength: 1.0
    max_steps: 15000000
    time_horizon: 256
    summary_freq: 50000
    keep_checkpoints: 25
    checkpoint_interval: 500000
