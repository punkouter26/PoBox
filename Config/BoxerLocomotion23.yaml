# Locomotion gen 23 (2026-09-07). Balance run. Gen 21 with ONE reward change,
# so the pair isolates it: same horizon settings, same speed pin, same budget,
# same from-scratch start. See BoxerLocomotion21.yaml for the horizon argument.
#
# THE CHANGE: at commanded speed 0 the reward could not tell a stance from a
# flamingo, and now it can. See STEPPING_CREDIT_BLEND in Reward_Locomotion for
# the derivation; the short version is that both the support term and the
# clearance term saturate at gaitBlend 0 whether the fighter is planted on two
# feet or holding one in the air, so a speed-0 run optimises neither.
#
# THE EVIDENCE, measured with Systems_EvalHarness at commanded speed 0:
#
#                          SingleSupport   StepsBetweenFalls (Capsule)
#   heuristic PD bot           0.053              112.1
#   Locomotion_gen20           0.740               80.2
#   Locomotion_gen18_34M       0.807               67.6
#
# The two trained brains stand on one leg. The code-driven bot stands on two
# and BEATS BOTH ON THE CAPSULE by 40%. A hand-written PD controller
# out-standing twenty generations of policy is not a statement about RL; it is
# a statement about what the reward asked for.
#
# WHY IT SHOULD MATTER MORE IN THE RING THAN ON THIS BENCH. The balance contest
# runs hazards and shoves; this scene has neither. One-footed standing is far
# more fragile under a lateral impulse than a two-foot stance, so the gap this
# run is trying to open should be WIDER in the game than in the measurement.
# That also means this bench cannot fully confirm the win, and the contest
# scene is where the claim has to be settled.
#
# SUCCESS: SingleSupportMean near the heuristic's 0.05 rather than gen 20's
# 0.74, AND StepsBetweenFalls at or above gen 21's on every body. The first
# without the second is just a different way to fall over.
#
# FAILURE THAT WOULD MEAN SOMETHING: two-footed standing arrives and the fall
# clock does not improve. That would say posture was never the limit and send
# the next generation back to the horizon result gen 21 measures.
#
# Run: mlagents-learn Config/BoxerLocomotion23.yaml --run-id=boxer_locomotion23
#      --env EnvBuild2/PoBoxTrain.exe --no-graphics --num-envs 5 --base-port 5200

behaviors:
  Boxer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.97
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 60000000
    time_horizon: 1000
    summary_freq: 50000
    keep_checkpoints: 40
    checkpoint_interval: 1000000

environment_parameters:
  # PINNED AT ZERO, exactly as gen 20. This run must differ from gen 20 in the
  # estimator and in nothing else that the curriculum controls.
  speed_command_max: 0.0
