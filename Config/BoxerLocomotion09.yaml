# Locomotion gen 9 (2026-08-21). Gen 8's constant was measured and the constant
# is not the lever. The SHAPE of the support term is.
#
# WHAT GEN 8 MEASURED (results/boxer_locomotion08, 9.55M of 18M steps, stopped
# early per this file's own gen-8 stop rule):
#
#   step   lesson  reward  survived  support  clearance
#   5.75M     0     0.090     315     0.022     0.157
#   6.35M     1     0.129     510     0.014     0.105
#   7.55M     2     0.097     884     0.009     0.136   <- peak survival 17.7 s
#   8.15M     2     0.104     856     0.011     0.156
#   8.75M     2     0.067     567     0.014     0.183
#   9.35M     2     0.033     250     0.022     0.248
#   9.55M     2     0.053     419     0.021     0.217
#
# GAIT_FULL_SPEED 1.0 -> 0.6 did what it was predicted to do and it was not
# enough. Support finally moved in the right direction — 0.009 -> 0.022, where
# gen 7 was pinned flat for 12.2M steps — but stalled an order of magnitude
# short of the 0.15 target, and reward peaked at 0.115 without reaching the
# 0.17 Shuffle gate.
#
# WHY. supportReward was Lerp(doubleSupport, singleSupport, gaitBlend), so at
# blend b planting scores (1 - b) and stepping scores b. The two cross at
# b = 0.5, which means the term stops discriminating exactly where the
# curriculum spends its time and pays planting MORE below it:
#
#   gen 7  GAIT_FULL_SPEED 1.0  rung-3 blend 0.32   planted 0.68  stepping 0.32
#   gen 8  GAIT_FULL_SPEED 0.6  rung-3 blend 0.53   planted 0.47  stepping 0.53
#
# After the 0.3 exponent, gen 8 offered stepping a 4.1% per-step gain. Return
# is per-step score times survived/MaxStep, and gen 8's own collapse from 880
# surviving steps to 250 cost 72% of the return. 4% never had a chance of
# buying a behaviour that risks the episode, and the fighter behaved
# accordingly.
#
# This also kills the fallback this file pre-registered for gen 9. Backing off
# to 0.8 puts rung 3 at blend 0.40, where planting scores 0.60 against
# stepping's 0.40 — gen 7's inversion, returning. No value of that constant
# fixes a term whose discrimination vanishes at its own midpoint, so 0.6 stays.
#
# THE FIX IS IN CODE, in Reward_Locomotion:
#
#   1. supportReward = min(1, singleSupport + (1 - gaitBlend) * doubleSupport)
#      Single support is worth full marks at every blend; only the credit for
#      standing planted fades. StandStill is unchanged (planted still scores
#      1.0 at blend 0), rung 3 now pays stepping 25.7% over planting instead of
#      4.1%, and planting can never outscore stepping at any blend.
#
#   2. Clearance is zeroed when BOTH feet are off the floor. There is no stance
#      foot in that state, so the foot-to-foot gap is a topple, not a step.
#      singleSupport already excluded it via XOR; clearance did not, so falling
#      paid up to 31% on that term. Gen 8's last 1.4M steps are that exploit
#      running: clearance 0.156 -> 0.248 while survival fell 856 -> 250 and
#      support stayed flat. This is a bug fix in the family of the gen-5 blind
#      clearance sensor, not a second experimental variable — leaving it in
#      would make gen 9's clearance column unreadable.
#
# THE CURRICULUM BELOW IS UNCHANGED from gen 8, including the 0.17 Shuffle
# gate, for the third generation running. One mechanism moves per generation.
#
# WATCH Locomotion/SingleSupportMean, NOT reward.
#   Working:     it climbs off ~0.01 toward 0.15+ while StepsSurvived holds
#                above ~400. Reward clears 0.17 on the way past.
#   Too steep:   StepsSurvived falls under ~250 while ClearanceMean climbs.
#                With the airborne exploit closed, that now means the fighter
#                is genuinely stepping and falling — gen 10 then attacks the
#                cost of a fall (shorter episodes, or a stumble that does not
#                terminate), NOT the support term again.
#   Still flat:  support pinned near 0.02 past ~8M steps despite a 26% gain on
#                offer. Then the per-step reward is not what is blocking it and
#                gen 10 looks at the action space / PD drive authority instead
#                of the reward at all. Stop the run; do not spend the rest.
#
# NOT RESUMABLE from gen 8 or earlier: the reward shape changes here. The
# observation count is still 127, so an old checkpoint loads and behaves like
# nonsense rather than erroring. Start fresh, no --resume.
#
# Gen 8's best brain, if it is wanted for the walk contest, is
# results/boxer_locomotion08/Boxer/Boxer-7999*.onnx (17.7 s survival, the best
# standing fighter the project has produced). It does not step.

behaviors:
  Boxer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 18000000
    time_horizon: 256
    summary_freq: 50000
    keep_checkpoints: 25
    # 200000 steps is ~2.6 min at this scene's measured 1,267 steps/s. Tightened
    # from 500000 on 2026-08-21 because the run is being interrupted for
    # in-scene tests: the trainer has to be stopped for each one (a contest
    # scene would otherwise connect to port 5004 and hand the trainer an env
    # with no trainable behaviours), and --resume rewinds to the last
    # checkpoint. This caps what each test costs.
    checkpoint_interval: 200000

environment_parameters:
  # Upper end of the commanded speed. Reward_Locomotion draws each episode's
  # command from [0, speed_command_max] while the cap is low, and holds the
  # floor at 60% of the cap once the cap clears 0.3 m/s, so late lessons
  # cannot be farmed by banking easy near-zero commands.
  speed_command_max:
    curriculum:
      - name: StandStill
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.15
          require_reset: true
        value: 0.0
      - name: Sway
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.16
          require_reset: true
        value: 0.2
      - name: Shuffle
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.17
          require_reset: true
        value: 0.4
      - name: Step
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.18
          require_reset: true
        value: 0.6
      - name: Stride
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.19
          require_reset: true
        value: 0.8
      - name: Walk
        value: 1.0
