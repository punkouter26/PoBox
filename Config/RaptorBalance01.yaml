# Raptor balance, generation 1 (2026-08-31). The PhysX port of the MuJoCo
# raptor (PoBox-MuJoCo/RAPTOR.md): 13 joints, 114 observations, 21 actions.
# Same gen-3 recipe as GrandmaBalance04 — product-form balance reward plus the
# strength/shove/cube curricula — on the raptor training scene, which applies
# NO gen-2 rig tweaks: its training dynamics must equal its contest dynamics.
# Scene: SCN_TRAIN_BALANCE_RAPTOR   run id: raptor_balance01
behaviors:
  Boxer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.999
        strength: 1.0
    max_steps: 15000000
    time_horizon: 256
    summary_freq: 50000
    keep_checkpoints: 25
    checkpoint_interval: 500000

environment_parameters:
  strength_scale:
    curriculum:
      - name: WeakMotors
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.4
        value: 0.6
      - name: MediumMotors
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.55
        value: 0.8
      - name: FullMotors
        value: 1.0
  shove_force_max:
    curriculum:
      - name: CalmAir
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.5
        value: 0.0
      - name: GentleShoves
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.5
        # 75 kg-tuned forces scaled by 20/75 so each lesson is the same
        # disturbance per kilogram on the 20 kg raptor.
        value: 16.0
      - name: LightShoves
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.6
        value: 32.0
      - name: FullShoves
        value: 80.0
  cube_speed_max:
    curriculum:
      - name: NoCubes
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 0.65
        value: 0.0
      - name: SoftCubes
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 0.7
        value: 6.0
      - name: ContestCubes
        value: 12.0
