# Locomotion gen 18 (2026-08-23). GEN 17 WITH THE BUDGET IT NEEDED. One change:
# max_steps 18M -> 42M, started from gen 17's weights via
# --initialize-from=boxer_locomotion17. Every reward term, weight and gate is
# gen 15's, untouched for the fifth generation running.
#
# WHY THIS AND NOT A NEW IDEA. Gen 17 is not a run that plateaued; it is a run
# that was interrupted by its own step budget:
#
#   16M  0.572     17M  0.601 (touched the 0.60 Sway gate)
#   17.9M 0.589    17.95M 0.598    18M 0.574  -> exported and stopped
#
# It cleared StandStill at 9.0M and ended on Sway having nearly cleared that
# too. Nine of its eighteen million steps went on standing still, because a
# three-body population climbs to a single-body-calibrated threshold more slowly
# (gen 15 cleared the same gate at 5.7M with one body). That left barely half
# the budget for every locomotion lesson — Sway, Shuffle, Step, Stride, Walk.
#
# Adding a clever new term on top of a run that never got to walk would be
# guessing. The measured bottleneck is steps, so the change is steps.
#
# INITIALIZE-FROM IS THE OTHER HALF, and it is not a second variable so much as
# the same one: it refuses to pay the 9M StandStill tax twice. The transferred
# policy already satisfies that gate (gen 17 finished at 0.574 against a 0.55
# threshold), so the curriculum — which DOES restart at lesson 0 under
# initialize-from — should clear it in a small fraction of 9M and hand the rest
# of the budget to the walking lessons that have never had any.
#
# WHAT WOULD COUNT AS SUCCESS, in the order these actually matter:
#   1. Reaching Shuffle (0.4 m/s) and Step (0.6 m/s) at all. Gen 17 never did.
#   2. Locomotion/Alternation rising ONCE A REAL SPEED IS COMMANDED. Gen 17
#      ended at 0.173, but on Sway at 0.10 m/s, where there is almost nothing to
#      alternate — that number is not evidence of hopping and must not be read
#      against gen 15's 0.736, which was measured at 0.47 m/s on Step.
#   3. StepsSurvived holding at or above gen 17's 135-155. That is BALANCE, it
#      is already the best in the project's history (gen 15: 85), and a
#      locomotion gain that costs it is not a gain.
#
# FAILURE MODES, AND WHAT EACH MEANS:
#   Stuck on StandStill past ~4M   initialize-from did not take. Check the run
#                                  actually loaded gen 17's weights rather than
#                                  starting cold.
#   Clears Sway, stalls on Shuffle Genuinely the hard rung — it is where gens
#                                  7-9 all died. THEN the reward shape is worth
#                                  revisiting, with evidence.
#   Any body earning ~0            Another rig difference dereferenced
#                                  somewhere. CHECK THE EDITOR CONSOLE, not the
#                                  trainer log. Exactly zero is never a training
#                                  outcome; ProductFactor floors at 0.01. This
#                                  is what cost gen 16 its entire run.
#
# Watch the PER-BODY split, not the 16-agent mean. Observation count 127.

behaviors:
  Boxer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    # 42M, up from 18M. This is THE change in gen 18.
    #
    # Gen 17 did not plateau — it ran out. It was still climbing at 18M (0.590,
    # 0.598 in its last two summaries) and had touched the Sway gate at 17M. It
    # spent NINE MILLION of its eighteen on StandStill, because a three-body
    # population climbs to a single-body threshold more slowly, leaving only 9M
    # for every locomotion lesson after it. 42M is roughly 8 hours at the
    # ~1,485 steps/s this scene sustains.
    max_steps: 42000000
    time_horizon: 256
    summary_freq: 50000
    keep_checkpoints: 25
    # Raised from 200000 now the run is headless: the trainer no longer has to
    # be stopped for in-scene tests, so checkpoints exist for rollback rather
    # than to cap the cost of an interruption.
    checkpoint_interval: 500000

environment_parameters:
  # Upper end of the commanded speed. Reward_Locomotion draws each episode's
  # command from [0, speed_command_max] while the cap is low, and holds the
  # floor at 60% of the cap once the cap clears 0.3 m/s, so late lessons
  # cannot be farmed by banking easy near-zero commands.
  speed_command_max:
    curriculum:
      - name: StandStill
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.55
          require_reset: true
        value: 0.0
      - name: Sway
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.60
          require_reset: true
        value: 0.2
      - name: Shuffle
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.45
          require_reset: true
        value: 0.4
      - name: Step
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.40
          require_reset: true
        value: 0.6
      - name: Stride
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.38
          require_reset: true
        value: 0.8
      - name: Walk
        value: 1.0
