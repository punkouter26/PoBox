# Stage 1 — balance. Behavior key MUST be "Boxer" (BehaviorParameters name).
# gamma 0.999 = 20 s lookahead at 50 Hz decisions (covers a full shove cycle).
# max_steps sized for decision period 1 (Walker-class ragdolls need ~1e7+).
behaviors:
  Boxer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.999
        strength: 1.0
    max_steps: 20000000
    time_horizon: 256
    summary_freq: 50000
    keep_checkpoints: 5
    checkpoint_interval: 500000
