# Locomotion gen 30 (2026-09-07). Gen 29 with beta raised 0.005 -> 0.02.
# Config-only, so it shares gen 29's env build; the pair isolates the entropy
# bonus and nothing else.
#
# WHY. Gen 21's horizon fix bundled beta 0.01 -> 0.005, copied from ML-Agents'
# Walker example, on the reasoning that standing still is a LOW-entropy
# behaviour that 0.01 pays the policy to keep jittering out of. For the balance
# line that reasoning held and then some: gen 25 reached reward 0.945 and
# effectively stopped falling.
#
# For the walk line it may be exactly backwards. Agent_FighterBoxing's gait-clock
# comment records the diagnosis from 2026-08-19 in as many words: single support
# 0.005 and foot lift 0.09 mm "at every reward weighting tried across three
# generations -- an exploration problem, not an incentive one". Halving the
# entropy bonus halves exploration, and both walk runs since have slid rather
# than stepped:
#
#   run      steps  lesson   alternation  clearance  speed match
#   gen 26   23.9M  Shuffle     0.005       0.017       0.809
#   gen 28    5.2M  Shuffle     0.012       0.024       0.710
#   gen 29    3.1M  Shuffle     0.007       0.011       0.446
#
# against gen 18's 0.766 alternation at beta 0.01. Every one of them hits the
# commanded pace without ever picking a foot up.
#
# 0.02 is deliberately PAST gen 18's 0.01 rather than back to it. Stepping has to
# be discovered before it can be reinforced, these runs start from a policy that
# has learned to hold extremely still, and the balance half of this session is
# already banked in gen 25 and gen 27 -- so this run can afford to be noisy.
#
# SUCCESS: alternation climbing off the floor. Anything approaching gen 18's
# 0.766 while keeping the inherited balance would be a walk brain worth shipping.
#
# FAILURE THAT WOULD MEAN SOMETHING: alternation still pinned near zero at 0.02.
# That would clear entropy too, and leave the reward's own gait terms -- support,
# clearance, alternation -- as the only remaining suspects, which is where gens
# 5-15 already looked and did not find it.
#
# Run: mlagents-learn Config/BoxerLocomotion30.yaml --run-id=boxer_locomotion30
#      --initialize-from=boxer_locomotion25 --env EnvBuild6/PoBoxTrain.exe
#      --no-graphics --num-envs 6 --base-port 5900

behaviors:
  Boxer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.02
      epsilon: 0.2
      lambd: 0.97
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 50000000
    time_horizon: 1000
    summary_freq: 50000
    keep_checkpoints: 40
    checkpoint_interval: 1000000

environment_parameters:
  # The six-rung ladder is gen 18's, value for value and threshold for
  # threshold. Changing the curriculum in the same generation as the estimator
  # would make the comparison against gen 18 unreadable.
  speed_command_max:
    curriculum:
      - name: StandStill
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.55
          require_reset: true
        value: 0.0
      - name: Sway
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.60
          require_reset: true
        value: 0.2
      - name: Shuffle
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.45
          require_reset: true
        value: 0.4
      - name: Step
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.40
          require_reset: true
        value: 0.6
      - name: Stride
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.38
          require_reset: true
        value: 0.8
      - name: Walk
        value: 1.0
