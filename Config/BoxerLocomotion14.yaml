# Locomotion gen 14 (2026-08-22). Gen 13 walked. On one leg.
#
# WHAT GEN 13 MEASURED (results/boxer_locomotion13, full 18M steps):
#
#   step   lesson  reward  1stFall  stumbles  support  clear  spdMatch
#   9.50M     3     0.337      111     26.75    0.040  0.126     -
#  11.45M     3     0.343       93     32.81    0.283  0.327     -
#  12.80M     4     0.393       90     33.69    0.519  0.541     -
#  13.55M     5     0.470       84     34.81    0.734  0.734   0.804
#  17.95M     5     0.613       83     34.84    0.951  0.946   0.900
#
# Removing the stumble budget worked. Stumbles ran free at 33-36 where gen 12's
# cap of 30 had clamped it, episodes held at 2999 steps throughout, and the
# curriculum went Shuffle -> Step -> Stride -> WALK in 4M steps after gen 12
# had spent 8M stuck in Step. SingleSupportMean finished at 0.951 against gen
# 12's 0.265 and a 0.031 ceiling across gens 5-11, with SpeedMatchMean 0.900 at
# 0.82 m/s commanded -- it really was travelling.
#
# THEN THE BRAIN WAS RUN IN INFERENCE AND LOOKED AT:
#
#   rig  leftFootLow  rightFootLow  contact
#    0       -0.016         0.235      L-
#    3       -0.018         0.253      L-
#    5       -0.017         0.237      L-
#
#   right foot higher on 15 of 16 fighters, mean lift 0.183 m
#   right-foot-only support: 0 occurrences in 48 fighter samples
#
# It stands on its LEFT leg and holds the right one in the air, lurching
# forward at 0.8 m/s and toppling every 1.7 s.
#
# Every term was satisfied because not one of them cares WHICH foot.
# singleSupport is an XOR. clearance takes the higher foot. The speed term is
# happy with a lurch. The comment on _singleSupportWeight claimed from gen 2
# through gen 13 that this term "forces alternation"; it never did, and once
# gen 12 made stepping affordable the cheapest way to collect was to lift one
# leg and never put it back down.
#
# This is the third exploit of a measurement in this project -- gen 4 read a
# stale reset snapshot, gen 10 rotated the foot instead of lifting it, gen 13
# lifted one foot forever. Each was found by looking at the fighter rather than
# at the curves, and each time the curves looked like success.
#
# THE FIX IS IN CODE. _stanceBias is an exponential moving average of which
# foot is bearing (-1 permanently left, +1 permanently right, 0 even, ~0.6 s
# time constant). symmetry = 1 - |bias| now multiplies the support term, faded
# in by gaitBlend so it cannot punish correct two-footed standing at
# StandStill. At the Walk rung:
#
#   gen 13 one-legged hop (bias -1)   support 0.000 -> 0.251 after exponent
#   limping 80/20 (bias -0.6)         support 0.400 -> 0.760
#   even alternation (bias 0)         support 1.000 -> 1.000
#
# The exploit goes from full marks to a 4x penalty. Nothing else changes:
# stumbles stay unbudgeted, clearance stays true ground clearance, gates are
# unchanged for the third generation.
#
# WATCH Locomotion/GaitSymmetry, a new stat. It is the number that says whether
# this is walking or hopping, and it is the one gens 2-13 never had.
#   Working:     symmetry above ~0.7 while support stays high and SpeedMatchMean
#                holds. That is both legs sharing the work at speed.
#   Hopping:     symmetry under ~0.3 with support still near 0.9. Gen 13's
#                behaviour surviving the penalty, which would mean the symmetry
#                weight needs to be its own exponent rather than a multiplier.
#   Overcorrect: symmetry near 1.0 but support collapsing back under 0.1. It has
#                gone back to standing on both feet to keep bias at zero; then
#                gen 15 makes symmetry reward ALTERNATION RATE (stance switches
#                per second) instead of load balance.
#
# NOT RESUMABLE from gen 13 or earlier: the support term changes shape.
# Observation count is still 127, so an old checkpoint loads as nonsense.
#
# Gen 9 is still the best BALANCE brain (25.8 s, Assets/Agents/Locomotion_gen9/).
# Gen 13 is banked at Locomotion_gen13/ as the first brain that travels at
# commanded speed, with the one-legged caveat recorded in its SOURCE.txt.

behaviors:
  Boxer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 18000000
    time_horizon: 256
    summary_freq: 50000
    keep_checkpoints: 25
    # Raised from 200000 now the run is headless: the trainer no longer has to
    # be stopped for in-scene tests, so checkpoints exist for rollback rather
    # than to cap the cost of an interruption.
    checkpoint_interval: 500000

environment_parameters:
  # Upper end of the commanded speed. Reward_Locomotion draws each episode's
  # command from [0, speed_command_max] while the cap is low, and holds the
  # floor at 60% of the cap once the cap clears 0.3 m/s, so late lessons
  # cannot be farmed by banking easy near-zero commands.
  speed_command_max:
    curriculum:
      - name: StandStill
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.55
          require_reset: true
        value: 0.0
      - name: Sway
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.60
          require_reset: true
        value: 0.2
      - name: Shuffle
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.45
          require_reset: true
        value: 0.4
      - name: Step
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.40
          require_reset: true
        value: 0.6
      - name: Stride
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.38
          require_reset: true
        value: 0.8
      - name: Walk
        value: 1.0
