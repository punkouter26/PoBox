# Stage 1 — balance, run 03. Continues run 02 (init from its final
# checkpoint via --initialize-from=boxer_balance02). Run 02 ended in
# lesson 2 (LightShoves, 120 N); this run re-climbs the curriculum fast
# and pushes into FullShoves (300 N).
# Behavior key MUST be "Boxer" (BehaviorParameters name).
# Run: mlagents-learn Config/BoxerBalance03.yaml --run-id=boxer_balance03 --initialize-from=boxer_balance02
behaviors:
  Boxer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.999
        strength: 1.0
    max_steps: 20000000
    time_horizon: 256
    summary_freq: 50000
    keep_checkpoints: 5
    checkpoint_interval: 500000

environment_parameters:
  shove_force_max:
    curriculum:
      - name: CalmAir
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.5
        value: 0.0
      - name: GentleShoves
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.5
        value: 60.0
      - name: LightShoves
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.6
        value: 120.0
      - name: FullShoves
        value: 300.0
