# Stage 2 — boxing self-play (SKELETON — needs the boxing scene + opponent
# observations re-enabled before first use):
#   1. Flip _observeOpponent to true on the fighter prefabs, re-run
#      Tools > ML Boxing > 3 (obs count returns to 138), rebuild scenes.
#   2. Evaluate with the ELO chart in TensorBoard (Self-Play/ELO), NOT mean
#      reward — project rule. Reward here should be win/loss shaped, not balance.
# Run: mlagents-learn Config/BoxerSelfPlay01.yaml --run-id=boxer_selfplay01
behaviors:
  Boxer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant   # constant for self-play stability
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99                      # shorter horizon than balance: bouts end
        strength: 1.0
    max_steps: 50000000
    time_horizon: 256
    summary_freq: 50000
    keep_checkpoints: 5
    checkpoint_interval: 500000
    self_play:
      save_steps: 100000
      team_change: 200000
      swap_steps: 20000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
