# Locomotion gen 13 (2026-08-22). Gen 12 broke the wall. This removes the one
# thing that stopped it going further.
#
# WHAT GEN 12 MEASURED (results/boxer_locomotion12, full 18M steps):
#
#   step   lesson  reward  1stFall  stumbles  support  clearance
#   4.90M     0     0.566      121     24.97    0.084     0.106   StandStill cleared
#   7.05M     1     0.630     1571      9.88    0.020     0.028   Sway cleared, 31.4 s
#   9.70M     3     0.460     1069     18.75    0.043     0.079   SHUFFLE CLEARED
#  11.55M     3     0.308       92     30.00    0.176     0.255
#  14.05M     3     0.343       88     30.00    0.217     0.315
#  18.00M     3     0.356       84     30.00    0.261     0.379
#
# Three firsts. It cleared Shuffle, the rung that stopped gens 5-11, and did it
# legitimately with gen 11's toe-pivot closed. It reached Step (0.6 m/s), which
# no generation had seen. And SingleSupportMean ended at 0.261, still climbing,
# against a ceiling of 0.031 across every previous generation -- 8.5x, and the
# first time the fighter has genuinely taken its feet off the floor.
#
# Balance record too: 1,571 steps to first fall (31.4 s) at the Sway
# transition, beating gen 9's 25.8 s.
#
# WHAT WENT WRONG: Stumbles pinned at 30.00 from 10.25M onward -- the exact
# moment the fighter started stepping and its time-to-first-fall fell to ~88
# steps. Episode length collapsed back to (budget + 1) x first-fall and the
# return went back to being proportional to survival, which is the very cliff
# gen 12 existed to remove. Reward flattened at ~0.35 against the 0.40 Step
# gate for the last 7M steps while support kept climbing, so the run ended
# improving but unable to bank it.
#
# THE BUDGET IS THE WRONG SHAPE, not a wrong number. The calibration pilot had
# already caught it binding at 6; raising it to 30 only moved the step count at
# which it bound. Falls become frequent precisely WHEN the fighter starts
# stepping, so any fixed budget binds exactly when it matters most.
#
# So gen 13 removes it. Falls never end an episode; only MaxStep does, and one
# fall costs exactly one 25-step recovery window. Balance keeps a real gradient
# regardless: at gen 12's ~88 steps between falls the recoveries eat 22% of the
# earning time, so staying upright is still worth about a quarter more reward.
# The cost is simply bounded and local now instead of forfeiting the remainder.
#
# GATES ARE UNCHANGED from gen 12 and were not re-derived. Episodes now run the
# full 3,000 steps instead of ~2,730, and spend ~26 recovery windows instead of
# 30, so the same behaviour earns roughly 18% more. That lifts gen 12's stalled
# 0.356 to about 0.42, just past the 0.40 Step gate -- which is the point. The
# gates already sit above what a non-stepping fighter can reach at each rung;
# raising them now would re-erect the wall gen 12 just cleared.
#
# WATCH Locomotion/Stumbles AND Environment/Episode Length TOGETHER.
#   Working:     Episode Length pinned at 2999 with Stumbles free to move.
#                Support continues from 0.26 upward; the Step gate falls.
#   Regression:  support falls back toward 0.03 while 1stFall climbs past ~500.
#                The fighter has rediscovered standing, meaning recoveries are
#                too cheap; gen 14 lengthens STUMBLE_RECOVERY_STEPS rather than
#                reinstating any budget.
#   Thrashing:   Stumbles above ~100 with support flat -- it is falling
#                immediately every time and never earning. Then the recovery
#                window is too short to re-settle and gen 14 raises it.
#
# NOT RESUMABLE from gen 12 or earlier: episode structure changes again.
# Observation count is still 127, so an old checkpoint loads as nonsense.
#
# Headless: --env=EnvBuild/PoBoxTrain.exe --num-envs=2 --no-graphics,
# ~1,875 steps/s against the Editor's 1,430.
#
# Gen 9 is still the best BALANCE brain (25.8 s, Assets/Agents/Locomotion_gen9/).
# Gen 12 is the first STEPPING brain and is banked at Locomotion_gen12/, but it
# falls every 1.7 s and is not usable in a contest.

behaviors:
  Boxer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 18000000
    time_horizon: 256
    summary_freq: 50000
    keep_checkpoints: 25
    # Raised from 200000 now the run is headless: the trainer no longer has to
    # be stopped for in-scene tests, so checkpoints exist for rollback rather
    # than to cap the cost of an interruption.
    checkpoint_interval: 500000

environment_parameters:
  # Upper end of the commanded speed. Reward_Locomotion draws each episode's
  # command from [0, speed_command_max] while the cap is low, and holds the
  # floor at 60% of the cap once the cap clears 0.3 m/s, so late lessons
  # cannot be farmed by banking easy near-zero commands.
  speed_command_max:
    curriculum:
      - name: StandStill
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.55
          require_reset: true
        value: 0.0
      - name: Sway
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.60
          require_reset: true
        value: 0.2
      - name: Shuffle
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.45
          require_reset: true
        value: 0.4
      - name: Step
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.40
          require_reset: true
        value: 0.6
      - name: Stride
        completion_criteria:
          measure: reward
          behavior: Boxer
          signal_smoothing: true
          min_lesson_length: 250
          threshold: 0.38
          require_reset: true
        value: 0.8
      - name: Walk
        value: 1.0
