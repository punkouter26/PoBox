<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>PoBox</title>
    <style>
      /* Portrait 9:16, the shape the whole UI was laid out for (project rule).
         Unity's stock template hard-codes a 960x600 landscape canvas, which
         squashed the menu until the slot list overlapped the buttons. */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0b0d;
        overflow: hidden;
      }
      #unity-container {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Fit inside BOTH dimensions: tall windows are limited by height, narrow
         windows by width. Letterboxes rather than distorting. */
      #unity-canvas {
        aspect-ratio: 9 / 16;
        height: min(100vh, calc(100vw * 16 / 9));
        width: auto;
        display: block;
        background: #0b0b0d;
      }
      #unity-loading-bar {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
        text-align: center;
        font-family: system-ui, sans-serif;
        color: #d9a441;
      }
      #unity-progress-bar-empty {
        width: 220px;
        height: 10px;
        margin-top: 14px;
        border: 1px solid #d9a441;
        border-radius: 5px;
        overflow: hidden;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #d9a441;
        transition: width 0.15s;
      }
      #unity-warning {
        position: fixed;
        left: 50%;
        top: 5%;
        transform: translate(-50%);
        background: #fff;
        padding: 10px;
        display: none;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div>PoBox</div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') {
          div.style = 'background: red; color: white; padding: 10px;';
        } else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WEB.loader.js";
      var config = {
        dataUrl: buildUrl + "/WEB.data.unityweb",
        frameworkUrl: buildUrl + "/WEB.framework.js.unityweb",
        codeUrl: buildUrl + "/WEB.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "PoBox",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      // Keep the render target matched to the letterboxed CSS box, so the game
      // renders at the portrait shape rather than being stretched into it.
      function resizeCanvas() {
        var rect = canvas.getBoundingClientRect();
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      loadingBar.style.display = "block";
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          resizeCanvas();
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
